# XTraffic — Phase 11 cross-city x cross-model faithfulness study.
# No magic numbers in code (CLAUDE.md): every knob the harness needs lives here.
#
# GOAL: show the Phase-5 hallucination result is NOT a METR-LA quirk and NOT a
# llama3.1 quirk. We rerun the A/B/C faithfulness study on TWO more cities
# (PEMS-BAY, Chicago -- both via ZERO-SHOT transfer of the METR-LA model) and a
# SECOND local LLM. If "condition A (with explanation) has near-zero
# hallucination while condition B (no explanation) spikes" holds across every
# city x model cell, the paper's core claim generalizes.

seed: 42                                         # reproducible sampling (CLAUDE.md)
source_city: metr_la                             # the city the checkpoint was trained on
source_checkpoint: models/gnn/checkpoints/metr_la_best.pt

# Cities to evaluate. metr_la runs on its own (in-domain) checkpoint; the others
# run ZERO-SHOT: node-agnostic weights transfer, node-specific embeddings are
# re-initialised at the target node count (the standard adaptive-graph limit,
# see evaluation/cross_city.py). Faithfulness is a PROMPT-STRUCTURAL property
# (does the LLM cite only what the explainer surfaced?), so it is well-defined
# even when zero-shot PREDICTION accuracy is degraded -- that is exactly why this
# is a clean "not-a-quirk" test.
cities: [metr_la, pems_bay, chicago]

# Stratified sampling: 5 time-of-day bands x 3 congestion terciles = 15 cells.
# per_stratum 7 -> up to ~105 windows, ~93 in practice (same as Phase 5).
per_stratum: 7
# Chicago is a small recent Socrata window (only 15 test windows), so we POOL
# train+val+test to reach this floor. Zero-shot => no Chicago training => pooling
# introduces no train/test leakage for a faithfulness (not accuracy) measurement.
chicago_min_scenarios: 20

models:
  # null -> use the model in configs/advisor.yaml (llama3.1:8b).
  primary: null
  # Second-model ladder (LLM-model ablation). We use the FIRST one that is
  # actually installed in the local Ollama. qwen2.5:7b is the playbook's first
  # choice, tinyllama the documented fallback; the rest are strong installed
  # alternatives from a DIFFERENT model family than llama3.1 (mistral) so the
  # cross-model evidence is not just "two llamas".
  second_ladder: [qwen2.5:7b, tinyllama, mistral:7b, gemma2:9b, llama3.2:3b]

conditions:
  primary: [A, B, C]     # full study on the primary model (A/C vs B is the story)
  second: [A, B]         # the second model only needs A vs B (the hallucination gap)

# CHANCE BASELINES (Phase-11 correction; the traffic analogue of Phase 19's
# RANDOM_bus / RANDOM_zone rows). A citer that draws locations UNIFORMLY, with no
# model and no explanation, still scores non-zero under this metric — because
# region-level credit gives a coarse citation the whole region's node set. Without
# these rows, "A scored F1 0.86" is uninterpretable: the graphs differ in size
# (207 / 325 / 1020 nodes) and in region granularity, so the same F1 means
# different things per city and the cells are NOT comparable to each other.
#   node   -> draw from the full rendered sensor names  (precise citations)
#   region -> draw from the region labels               (coarse citations)
random_baselines: [node, region]
random_draws: 200        # uniform draws per scenario per baseline -> its expectation

explainer:
  epochs: 200            # GNNExplainer mask-optimisation steps (Phase-3 default)
  confidence_runs: 5     # reruns for explanation_confidence (Phase-3 default)
  top_k: 8               # top-k causal nodes per explanation (Phase-3 default)

output:
  results_dir: evaluation/results/cross_city_faithfulness
  tex: evaluation/paper/table_cross_city_faith.tex
  # Reuse the committed Phase-5 llama3.1 METR-LA summary for that one cell instead
  # of recomputing ~93 scenarios we already have logged.
  #
  # TURNED OFF by the Phase-11 correction (FLAGGED). The committed Phase-5 summary
  # was scored under the OLD resolver, which discarded the sensor id inside a
  # rendered node name and awarded region-level credit instead (recall inflated
  # ~+0.2). Reusing it would mix two different scoring RULES in one master table,
  # which is worse than either rule alone. Recompute this cell so all six share
  # one rule. Turn back on only once the Phase-5 study itself has been rerun.
  reuse_phase5_metr_la: false
