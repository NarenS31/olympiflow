# XTraffic — Phase 4 LLM advisory-layer config (Layer 3).
# No magic numbers in code (CLAUDE.md): every knob the advisor needs lives here.

# --- Ollama backend (local only — no external APIs, no keys, CLAUDE.md) ---
ollama:
  host: "http://localhost:11434"   # local Ollama server
  # Model choice is an EXPERIMENTAL VARIABLE we ablate in Phase 7 — note in the
  # paper that swapping this is how we show results aren't an artifact of one LLM.
  model: "llama3.1:8b"
  # Low temperature: we want faithful TRANSLATION of the math explanation, not
  # creative writing. Near-0 keeps the model from inventing causes.
  temperature: 0.1
  # Ollama can be slow on a cold start (model load); generous timeout so a first
  # call doesn't spuriously fail. Same lesson as the OlympiFlow advisor (120s).
  timeout_seconds: 180
  # Ask Ollama to constrain output to JSON. Ollama supports format:"json".
  force_json: true

# --- Retrieval (city knowledge base) ---
retrieval:
  top_k: 4               # how many KB chunks to inject as CITY CONTEXT
  max_context_chars: 2000  # hard cap on injected KB text (keeps prompt small)
  # Phase 15b — the C_RICH condition uses a deliberately FULLER context block to
  # test whether MORE context (not just any context) moves faithfulness. It
  # retrieves more chunks (padding past the relevant ones into the rest of the KB)
  # and allows a bigger character budget. Only C_RICH reads these; A/B/C ignore them.
  rich_top_k: 9              # ~all 11 LA chunks -> corridors + incident + transit + capacities
  rich_max_context_chars: 4500

# --- Robustness: malformed-JSON retry loop ---
retry:
  max_retries: 2         # re-ask up to N times, appending the parse error

# --- Phase 16: Active Grounding Loop ---
# After the advisor answers under condition A, we AUTOMATICALLY score its
# faithfulness (Phase-5 metric) and, if it falls short, hand the LLM a targeted
# correction naming the explainer top-k nodes it failed to cite, then re-ask.
# These two knobs are the only magic numbers the loop needs (CLAUDE.md rule).
active_grounding:
  f1_threshold: 0.7      # advisories scoring BELOW this trigger a correction re-prompt
  max_rounds: 3          # max correction rounds AFTER the initial round-0 answer

# --- City -> knowledge-base file (under models/advisor/kb/) ---
cities:
  metr_la: "la.json"
  chicago: "chicago.json"   # Phase 6: built from the kb/README.md template
