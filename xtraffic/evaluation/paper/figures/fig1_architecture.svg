<text x="445.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">LAYER 1</text>
<text x="445.0" y="104" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">ST-GNN prediction</text>
<text x="445.0" y="122" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">(Graph WaveNet + MOD 1/2/3)</text>
<line x1="570" y1="105.0" x2="610" y2="105.0" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="60" width="250" height="90" rx="10" fill="#009E73" fill-opacity="0.15" stroke="#009E73" stroke-width="2"/>
<text x="735.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">LAYER 2</text>
<text x="735.0" y="104" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">GNNExplainer</text>
