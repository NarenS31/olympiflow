<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="220" viewBox="0 0 1180 220" font-family="Helvetica,Arial,sans-serif">
<rect width="1180" height="220" fill="white"/>
<rect x="30" y="60" width="250" height="90" rx="10" fill="#999999" fill-opacity="0.15" stroke="#999999" stroke-width="2"/>
<text x="155.0" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Heterogeneous inputs</text>
<text x="155.0" y="104" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">(sensors + weather</text>
<text x="155.0" y="122" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">+ events + transit)</text>
<line x1="280" y1="105.0" x2="320" y2="105.0" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
